name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path Packages/RoyalVNCKit
      - run: swift test --package-path Packages/SessionCore

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen && xcodegen generate
      # shortcut: ad-hoc signed, not notarized (ADR-0001 wants Developer ID); add the certificate and notarytool once secrets exist.
      - run: >
          xcodebuild -project VNCGlass.xcodeproj -scheme VNCGlass -configuration Release
          -derivedDataPath build CODE_SIGN_IDENTITY=- CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package DMG
        run: |
          mkdir dmg && cp -R "build/Build/Products/Release/VNC Glass.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "VNC Glass" -srcfolder dmg -format UDZO VNCGlass.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 MARKETING_VERSION project.yml | grep -oE '[0-9]+(\.[0-9]+)+')
          tag="v$version-${{ github.run_number }}"
          gh release create "$tag" VNCGlass.dmg --target "$GITHUB_SHA" --title "VNC Glass $version (${{ github.run_number }})" --generate-notes
